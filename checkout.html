            </a>

            <a href="products.html" class="link">

            <a href="search.html" class="link">

                    </svg>

                <span class="link-title">Search</span>

            <a href="cart.html" class="link">
                <span class="link-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">

        </div>
    </nav>

   
    <section class="checkout-main">
        <div class="container">
            <div class="checkout-header">
                <h1>Checkout</h1>
                <p>Order Summary & Shipping Details</p>
            </div>

            <div class="checkout-grid">
                <div class="order-summary">
                    <h2>📋 Your Order</h2>
                    <div id="orderItems"></div>
                    <div class="order-totals">
                        <div class="total-line">
                            <span>Subtotal:</span>
                            <span id="orderSubtotal">$0.00</span>
                        </div>
                        <div class="total-line">
                            <span>Shipping:</span>
                            <span>FREE</span>
                        </div>
                        <div class="total-line">
                            <span>Tax:</span>
                            <span id="orderTax">$0.00</span>
                        </div>
                        <hr>
                        <div class="grand-total">
                            <span>Total:</span>
                            <span id="orderGrandTotal">$0.00</span>
                        </div>
                    </div>
                </div>

                <div class="shipping-form-section">
                    <h2>🚚 Shipping Address</h2>
                    <form id="shippingForm">
                        <div class="input-group">
                            <input type="text" id="firstName" placeholder="First Name *" required>
                            <input type="text" id="lastName" placeholder="Last Name *" required>
                        </div>
                        <div class="input-group">
                            <textarea id="address" placeholder="Full Address *" rows="3" required></textarea>
                        </div>
                        <div class="input-group">
                            <input type="text" id="city" placeholder="City *" required>
                            <input type="tel" id="phone" placeholder="Phone *" required>
                        </div>
                        <button type="submit" class="order-btn" id="placeOrder">
                            Place Order - <span id="finalTotal">$0.00</span>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 MyShop. All rights reserved.</p>
        </div>
    </footer>
<script src="js/checkout.js"></script>

</body>
</html>
