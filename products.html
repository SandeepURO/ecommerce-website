        <div class="menu">

                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                        <path d="M213.38 109.62 133.38 36.88a8 8 0 0 0-10.76 0L42.62 109.62A8 8 0 0 0 40 115.54V208a8 8 0 0 0 8 8h160a8 8 0 0 0 8-8V115.54a8 8 0 0 0-2.62-5.92Z" fill="none" stroke="currentColor" stroke-width="16"/>
                    </svg>
                </span>
                <span class="link-title">Home</span>
            </a>

            <a href="products.html" class="link">
                <span class="link-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                        <rect x="40" y="40" width="176" height="176" rx="16" fill="none" stroke="currentColor" stroke-width="16"/>
                        <line x1="40" y1="96" x2="216" y2="96" fill="none" stroke="currentColor" stroke-width="16"/>
                    </svg>
                </span>
                <span class="link-title">Products</span>
            </a>

            <a href="category.html" class="link">
                <span class="link-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                        <path d="M32 80h72l24 24h96v96a16 16 0 0 1-16 16H48a16 16 0 0 1-16-16V80z" fill="none" stroke="currentColor" stroke-width="16" stroke-linejoin="round"/>
                    </svg>
                </span>
                <span class="link-title">Categories</span>
            </a>

            <a href="search.html" class="link">
                <span class="link-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                        <circle cx="112" cy="112" r="64" fill="none" stroke="currentColor" stroke-width="16"/>
                        <line x1="160" y1="160" x2="216" y2="216" fill="none" stroke="currentColor" stroke-width="16"/>
                    </svg>
                </span>
                <span class="link-title">Search</span>
            </a>

            <a href="cart.html" class="link">
                <span class="link-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                        <circle cx="96" cy="216" r="16" fill="none" stroke="currentColor" stroke-width="16"/>
                        <circle cx="176" cy="216" r="16" fill="none" stroke="currentColor" stroke-width="16"/>

                <span class="link-title">Cart</span>

            <a href="contact.html" class="link">
                <span class="link-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
                        <path d="M222 182c-16 16-48 6-80-26s-42-64-26-80l24-24 40 40-24 24c8 16 24 32 40 40l24-24 40 40z" fill="none" stroke="currentColor" stroke-width="16" stroke-linejoin="round"/>
                    </svg>
                </span>
                <span class="link-title">Contact</span>
            </a>
        </div>
    </nav>

    <section class="products-page">
        <div class="container">
            <div class="page-header">
                <h1>All Products</h1>
                <p>Browse our latest collection</p>
            </div>

            <div class="products-layout">
                <aside class="filters-sidebar">
                    <h3>Filters</h3>
                    
                    <div class="filter-group">
                        <h4>Category</h4>
                        <select id="categoryFilter">
                            <option value="">All Categories</option>
                            <option value="electronics">Electronics</option>
                            <option value="fashion">Fashion</option>
                            <option value="home">Home & Garden</option>
                            <option value="sports">Sports</option>
                        </select>
                    </div>

                    <div class="filter-group">
                        <h4>Price Range</h4>
                        <div class="price-range">
                            <input type="range" id="priceSlider" min="0" max="1500" value="1500">
                            <div class="price-display">
                                <span id="priceMin">$0</span> - <span id="priceMax">$1500</span>
                            </div>
                        </div>
                    </div>

                    <button id="clearFilters" class="clear-btn">Clear All Filters</button>
                </aside>

                <main class="products-main">
                    <div class="products-header">
                        <span id="resultsCount">24 Products</span>
                        <div class="sort-options">
                            <label>Sort by:</label>
                            <select id="sortSelect">
                                <option value="name">Name</option>
                                <option value="price-low">Price: Low to High</option>
                                <option value="price-high">Price: High to Low</option>
                                <option value="rating">Rating</option>
                            </select>
                        </div>
                    </div>

                    <div id="productsGrid" class="products-grid">
                    </div>

                </main>
            </div>
        </div>
    </section>
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-section">
                    <h3>MyShop</h3>
                    <p>Your trusted online store for quality products.</p>
                </div>
                <div class="footer-section">
                    <h4>Quick Links</h4>
                    <ul>
                        <li><a href="index.html">Home</a></li>
                        <li><a href="products.html">Products</a></li>
                        <li><a href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 MyShop. All rights reserved.</p>
            </div>
        </div>
    </footer>
    <button class="scroll-top" id="scrollTop">↑</button>

<script src="js/data.js"></script>
<script src="js/script.js"></script>
<script src="js/products.js"></script>

</body>
</html>
