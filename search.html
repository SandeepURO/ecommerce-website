<!-- SEARCH HEADER -->
<section class="search-header">
  <div class="container">
    <h1>Search Products</h1>

    <div class="search-container">
      <input 
        type="text" 
        class="search-input" 
        placeholder=" "
        id="searchInput"
        autocomplete="off"
      />
      <label class="label">Search products...</label>

      <span class="clear-button" id="clearSearch">✕</span>
      <span class="search-icon"></span>
      <div class="shine"></div>

      <div class="search-suggestions" id="suggestions"></div>
    </div>
  </div>
</section>

<section class="search-results">
    <div class="container">
        <p id="resultsCount">0 results found</p>
        <div class="products-grid" id="searchResults"></div>
    </div>
</section>
